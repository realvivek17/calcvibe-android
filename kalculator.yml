name: KalCulator v1.3.1 build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/kalculator.yml'

permissions:
  contents: read

concurrency:
  group: kalculator-v1.3.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-launch:
    name: Unit tests, APK, and bounded launch test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out workflow
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools emulator'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore bundled KalCulator source (no ZIP upload needed)
