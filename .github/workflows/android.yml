name: CalcVibe v1.2.1 Ã¢â‚¬â€ build, test and launch smoke test

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: calcvibe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-test:
    name: Unit tests, APK build and artifact upload
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the workflow repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK build tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Recreate bundled source project (no source upload needed)
