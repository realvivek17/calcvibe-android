name: CalcVibe Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: calcvibe-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test and build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: ''

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Validate source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s calcvibe-source.zip
          unzip -t calcvibe-source.zip

      - name: Unpack CalcVibe project archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p calcvibe-source
          unzip -q calcvibe-source.zip -d calcvibe-source
          test -f calcvibe-source/settings.gradle.kts
          test -f calcvibe-source/build.gradle.kts
          test -f calcvibe-source/app/build.gradle.kts
          test -f calcvibe-source/app/src/main/java/com/calcvibe/app/MainActivity.kt

      - name: Run unit tests
        run: gradle -p calcvibe-source :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle -p calcvibe-source :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        shell: bash
        run: test -s calcvibe-source/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: calcvibe-debug-apk
          path: calcvibe-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
