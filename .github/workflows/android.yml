        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_ARCHIVE_B64" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/calcvibe-source-v4.zip"
          unzip -t "$RUNNER_TEMP/calcvibe-source-v4.zip"
          rm -rf calcvibe-source
          mkdir -p calcvibe-source
          unzip -q "$RUNNER_TEMP/calcvibe-source-v4.zip" -d calcvibe-source
          test -f calcvibe-source/settings.gradle.kts
          test -f calcvibe-source/app/src/main/java/com/calcvibe/app/MainActivity.kt
          test -f calcvibe-source/app/src/main/java/com/calcvibe/app/CalcEngine.kt
          test -s calcvibe-source/app/src/main/res/raw/tap_soft.wav
          test -x calcvibe-source/scripts/android-smoke-test.sh
          grep -q 'versionCode = 4' calcvibe-source/app/build.gradle.kts
          grep -q 'versionName = "1.2.1"' calcvibe-source/app/build.gradle.kts
          sha256sum "$RUNNER_TEMP/calcvibe-source-v4.zip" | tee source-sha256.txt

      - name: Run calculation unit tests
        run: gradle -p calcvibe-source :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle -p calcvibe-source :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK and app identity
        shell: bash
        run: |
          set -euo pipefail
          APK=calcvibe-source/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(apkanalyzer manifest application-id "$APK")" = "com.calcvibe.app"
          apkanalyzer manifest version-code "$APK" | grep -qx '4'
          apkanalyzer manifest version-name "$APK" | grep -qx '1.2.1'
          sha256sum "$APK"

      # Direct APK upload happens BEFORE the emulator job/step. A device-test timeout cannot hide the APK.
      - name: Upload directly downloadable APK
        uses: actions/upload-artifact@v7
        with:
          path: calcvibe-source/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM when available
        shell: bash
        run: |
          set +e
          if command -v udevadm >/dev/null 2>&1; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
          else
            echo 'NOTICE: /dev/kvm unavailable; emulator can be slower.'
          fi
          exit 0

      - name: Launch app and run UI smoke tests (hard step timeout)
        timeout-minutes: 7
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 180
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: calcvibe-source
          script: bash scripts/android-smoke-test.sh

      - name: Collect diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p calcvibe-source/diagnostics
          echo "Diagnostic collection: $(date -u +%FT%TZ)" > calcvibe-source/diagnostics/context.txt
          adb devices -l > calcvibe-source/diagnostics/adb-devices.txt 2>&1
          timeout 20s adb logcat -d -v threadtime > calcvibe-source/diagnostics/logcat.txt 2>&1
          timeout 10s adb shell getprop sys.boot_completed > calcvibe-source/diagnostics/boot-completed.txt 2>&1
          timeout 10s adb exec-out screencap -p > calcvibe-source/diagnostics/screen.png 2>/dev/null
          ps -ef | grep -E '[e]mulator|[q]emu' > calcvibe-source/diagnostics/emulator-processes.txt
          true

      - name: Upload diagnostics only if launch test failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: calcvibe-diagnostics
          path: calcvibe-source/diagnostics/
          if-no-files-found: warn
          retention-days: 7
