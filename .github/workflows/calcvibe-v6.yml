name: KalCulator v1.3.1 — build, tests, APK and UI smoke test
on:
  workflow_dispatch: 
  push:
  branches:
- main
- master
  paths:
- .github/workflows/calcvibe-v6.yml
permissions:
  contents: read
concurrency:
  group: kalculator-v131-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-launch:
  name: Unit tests, APK, and bounded UI smoke test
  runs-on: ubuntu-24.04
  timeout-minutes: 35
  steps:
-
  name: Check out repository
  uses: actions/checkout@v7
-
  name: Set up Java 17
  uses: actions/setup-java@v6
  with:
    distribution: temurin
    java-version: 17
-
  name: Set up Android SDK
  uses: android-actions/setup-android@v4
  with:
    cmdline-tools-version: 15859902
    packages: platforms;android-35 build-tools;35.0.0 platform-tools emulator
-
  name: Set up Gradle 8.9
  uses: gradle/actions/setup-gradle@v6
  with:
    gradle-version: 8.9
-
  name: Download and validate KalCulator v1.3.1 source
  shell: bash
  run: set -euo pipefail
curl --fail --location --retry 3 --retry-all-errors \
  'https://litter.catbox.moe/0srr1t.zip' \
  --output "$RUNNER_TEMP/kalculator-source-v1.3.1.zip"
unzip -tq "$RUNNER_TEMP/kalculator-source-v1.3.1.zip"
rm -rf kalculator-source
mkdir -p kalculator-source
unzip -q "$RUNNER_TEMP/kalculator-source-v1.3.1.zip" -d kalculator-source
test -f kalculator-source/settings.gradle.kts
test -f kalculator-source/app/src/main/java/com/calcvibe/app/MainActivity.kt
test -f kalculator-source/app/src/main/java/com/calcvibe/app/CalcEngine.kt
test -f kalculator-source/scripts/android-smoke-test.sh
chmod +x kalculator-source/scripts/android-smoke-test.sh
grep -q 'versionCode = 8' kalculator-source/app/build.gradle.kts
grep -q 'versionName = "1.3.1"' kalculator-source/app/build.gradle.kts
sha256sum "$RUNNER_TEMP/kalculator-source-v1.3.1.zip"

-
  name: Run calculation unit tests
  run: gradle -p kalculator-source :app:testDebugUnitTest --no-daemon --stacktrace
-
  name: Build debug APK
  run: gradle -p kalculator-source :app:assembleDebug --no-daemon --stacktrace
-
  name: Verify APK identity and version
  shell: bash
  run: set -euo pipefail
APK='kalculator-source/app/build/outputs/apk/debug/app-debug.apk'
test -s "$APK"
test "$(apkanalyzer manifest application-id "$APK")" = 'com.calcvibe.app'
apkanalyzer manifest version-code "$APK" | grep -qx '8'
apkanalyzer manifest version-name "$APK" | grep -qx '1.3.1'
sha256sum "$APK"

-
  name: Upload directly downloadable APK
  uses: actions/upload-artifact@v7
  with:
    name: KalCulator-v1.3.1-APK
    path: kalculator-source/app/build/outputs/apk/debug/app-debug.apk
    archive: false
    if-no-files-found: error
    retention-days: 14
-
  name: Enable KVM when available
  shell: bash
  run: set +e
if command -v udevadm >/dev/null 2>&1; then
  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
  sudo udevadm control --reload-rules
  sudo udevadm trigger --name-match=kvm
fi
if [ -e /dev/kvm ]; then
  ls -l /dev/kvm
else
  echo 'NOTICE: /dev/kvm is unavailable; emulator startup may be slower.'
fi
exit 0

-
  name: Run Android emulator UI smoke test
  timeout-minutes: 12
  uses: reactivecircus/android-emulator-runner@v2
  with:
    api-level: 30
    target: google_apis
    arch: x86_64
    profile: pixel_2
    emulator-boot-timeout: 300
    emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
    disable-animations: true
    working-directory: kalculator-source
    script: bash scripts/android-smoke-test.sh
-
  name: Collect diagnostics on failure
  if: failure()
  shell: bash
  run: set +e
mkdir -p kalculator-source/diagnostics
echo "Diagnostic collection: $(date -u +%FT%TZ)" > kalculator-source/diagnostics/context.txt
adb devices -l > kalculator-source/diagnostics/adb-devices.txt 2>&1
timeout 20s adb logcat -d -v threadtime > kalculator-source/diagnostics/logcat.txt 2>&1
timeout 10s adb shell getprop sys.boot_completed > kalculator-source/diagnostics/boot-completed.txt 2>&1
timeout 10s adb exec-out screencap -p > kalculator-source/diagnostics/screen.png 2>/dev/null
ps -ef | grep -E '[e]mulator|[q]emu' > kalculator-source/diagnostics/emulator-processes.txt
true

-
  name: Upload diagnostics if the job failed
  if: failure()
  uses: actions/upload-artifact@v7
  with:
    name: kalculator-diagnostics
    path: kalculator-source/diagnostics/
    if-no-files-found: warn
    retention-days: 7
