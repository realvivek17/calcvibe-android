name: KalCulator v1.3.1 build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/kalculator-build.yml'

permissions:
  contents: read

concurrency:
  group: kalculator-v131-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-launch:
    name: Unit tests, APK, and bounded launch test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools emulator"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Download source
        run: |
          set -euo pipefail
          curl -fL "https://litter.catbox.moe/0srr1t.zip" -o src.zip
          rm -rf kalculator-source
          unzip -q src.zip -d kalculator-source
          chmod +x kalculator-source/scripts/android-smoke-test.sh
          test -f kalculator-source/app/src/main/java/com/calcvibe/app/MainActivity.kt
          grep -q 'versionName = "1.3.1"' kalculator-source/app/build.gradle.kts

      - name: Unit tests
        run: gradle -p kalculator-source :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build APK
        run: gradle -p kalculator-source :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=kalculator-source/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(apkanalyzer manifest application-id "$APK")" = "com.calcvibe.app"
          apkanalyzer manifest version-code "$APK" | grep -qx "8"
          apkanalyzer manifest version-name "$APK" | grep -qx "1.3.1"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: KalCulator-v1.3.1-APK
          path: kalculator-source/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: UI smoke test
        timeout-minutes: 7
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 180
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: kalculator-source
          script: bash scripts/android-smoke-test.sh

      - name: Upload diagnostics if the test failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kalculator-diagnostics
          path: kalculator-source/diagnostics/
          if-no-files-found: warn
          retention-days: 7
